<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllMatters Issue 依赖关系图</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }

        h1 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 30px;
            font-size: 14px;
        }

        #graph {
            width: 100%;
            height: 800px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background-color: #0d1117;
        }

        .node {
            cursor: pointer;
            stroke: #30363d;
            stroke-width: 2px;
        }

        .node:hover {
            stroke: #58a6ff;
            stroke-width: 3px;
        }

        .node-label {
            font-size: 11px;
            fill: #c9d1d9;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }

        .link {
            stroke: #58a6ff;
            stroke-opacity: 0.6;
            stroke-width: 2px;
            fill: none;
            marker-end: url(#arrowhead);
        }

        .link:hover {
            stroke-opacity: 1;
            stroke-width: 3px;
        }

        .legend {
            position: absolute;
            top: 80px;
            right: 30px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            font-size: 13px;
        }

        .legend-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid #30363d;
        }

        .tooltip {
            position: absolute;
            padding: 10px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 400px;
            font-size: 12px;
            z-index: 1000;
        }

        .tooltip-title {
            font-weight: bold;
            color: #58a6ff;
            margin-bottom: 5px;
        }

        .tooltip-deps {
            margin-top: 5px;
            color: #8b949e;
        }

        .instructions {
            text-align: center;
            margin: 20px 0;
            color: #8b949e;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>AllMatters v0.1.2 Issue 依赖关系图</h1>
    <div class="subtitle">
        更新时间: 2025-01-15 | 开放 Issues: 19个 | 已关闭重复项: #95-99
    </div>

    <div class="instructions">
        🖱️ 拖动节点 | 🔍 滚轮缩放 | 悬停查看详情 | 箭头表示依赖方向 (A → B 表示 B 被 A 阻塞)
    </div>

    <div id="graph"></div>

    <div class="legend">
        <div style="font-weight: bold; margin-bottom: 10px; color: #58a6ff;">图例</div>
        <div class="legend-item">
            <div class="legend-color" style="background: #238636;"></div>
            <span>无依赖 (可开始)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #da3633;"></div>
            <span>被阻塞</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #58a6ff;"></div>
            <span>子任务</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #6e7681;"></div>
            <span>其他</span>
        </div>
    </div>

    <div class="tooltip"></div>

    <script>
        // Issue data extracted from GitHub
        const graphData = {
  "nodes": [
    { "id": 96, "title": "[v0.1.2] Jigsaw map generation", "blocked_by": [95], "blocks": [77, 81] },
    { "id": 95, "title": "[v0.1.2] Map engine foundation", "blocked_by": [], "blocks": [77, 81, 82, 84, 96] },
    { "id": 94, "title": "Full recovery integration (#81d)", "blocked_by": [91, 92, 93], "blocks": [] },
    { "id": 93, "title": "Save restoration (#81c)", "blocked_by": [91, 92], "blocks": [94] },
    { "id": 92, "title": "Exploration UI recovery (#81b)", "blocked_by": [91], "blocks": [93, 94] },
    { "id": 91, "title": "Lobby state sync (#81a)", "blocked_by": [76], "blocks": [92, 93, 94] },
    { "id": 88, "title": "T15 双版组合验收", "blocked_by": [79, 81, 83, 84, 85, 86, 87], "blocks": [] },
    { "id": 87, "title": "T14 荣耀Boss恢复", "blocked_by": [82], "blocks": [88] },
    { "id": 86, "title": "T13 荣耀普通战精英", "blocked_by": [82], "blocks": [88] },
    { "id": 85, "title": "T12 巢穴追猎", "blocked_by": [82], "blocks": [88] },
    { "id": 84, "title": "T11 密林暗港追猎", "blocked_by": [82, 95], "blocks": [88] },
    { "id": 83, "title": "T10 空宝箱流程", "blocked_by": [82], "blocks": [88] },
    { "id": 82, "title": "T09 限步面具服务", "blocked_by": [78], "blocks": [83, 84, 85, 86, 87] },
    { "id": 81, "title": "T08 多人探索恢复", "blocked_by": [77, 80, 95, 96], "blocks": [88] },
    { "id": 80, "title": "T07 多人共享编辑", "blocked_by": [77], "blocks": [81] },
    { "id": 79, "title": "T06 换幕双Boss终局", "blocked_by": [77], "blocks": [88] },
    { "id": 78, "title": "T05 商店重访持久化", "blocked_by": [77], "blocks": [82] },
    { "id": 77, "title": "T04 探索房间进度", "blocked_by": [76, 95, 96], "blocks": [78, 79, 80, 81] },
    { "id": 76, "title": "T03 Ancient单人保存", "blocked_by": [75], "blocks": [77, 91] },
    { "id": 75, "title": "T02 自动拼图恢复", "blocked_by": [74], "blocks": [76] },
    { "id": 74, "title": "T01 手动拼图基础", "blocked_by": [], "blocks": [75] },
    { "id": 73, "title": "v0.1.2 正式实施规格", "blocked_by": [], "blocks": [] }
  ],
  "edges": []
};

        // Generate edges from blocked_by relationships
        graphData.nodes.forEach(node => {
            if (node.blocked_by) {
                node.blocked_by.forEach(dep => {
                    graphData.edges.push({ source: dep, target: node.id });
                });
            }
        });

        const width = document.getElementById('graph').clientWidth;
        const height = 800;

        const svg = d3.select('#graph')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        // Define arrowhead marker
        svg.append('defs').append('marker')
            .attr('id', 'arrowhead')
            .attr('viewBox', '0 -5 10 10')
            .attr('refX', 20)
            .attr('refY', 0)
            .attr('markerWidth', 6)
            .attr('markerHeight', 6)
            .attr('orient', 'auto')
            .append('path')
            .attr('d', 'M0,-5L10,0L0,5')
            .attr('fill', '#58a6ff');

        const g = svg.append('g');

        // Zoom behavior
        const zoom = d3.zoom()
            .scaleExtent([0.3, 3])
            .on('zoom', (event) => {
                g.attr('transform', event.transform);
            });

        svg.call(zoom);

        // Create force simulation
        const simulation = d3.forceSimulation(graphData.nodes)
            .force('link', d3.forceLink(graphData.edges)
                .id(d => d.id)
                .distance(150))
            .force('charge', d3.forceManyBody().strength(-500))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(40));

        // Draw links
        const link = g.append('g')
            .selectAll('path')
            .data(graphData.edges)
            .join('path')
            .attr('class', 'link');

        // Draw nodes
        const node = g.append('g')
            .selectAll('circle')
            .data(graphData.nodes)
            .join('circle')
            .attr('class', 'node')
            .attr('r', 25)
            .attr('fill', d => {
                // Color based on dependency status
                if (d.id >= 91 && d.id <= 94) return '#58a6ff'; // Sub-tasks
                if (d.blocked_by && d.blocked_by.length > 0) return '#da3633'; // Blocked
                if (!d.blocks || d.blocks.length === 0) return '#6e7681'; // Leaf
                return '#238636'; // Can start
            })
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended))
            .on('click', (event, d) => {
                window.open(`https://github.com/Endercloud001/AllMatters/issues/${d.id}`, '_blank');
            });

        // Add labels
        const label = g.append('g')
            .selectAll('text')
            .data(graphData.nodes)
            .join('text')
            .attr('class', 'node-label')
            .text(d => `#${d.id}`);

        // Tooltip
        const tooltip = d3.select('.tooltip');

        node.on('mouseover', (event, d) => {
            tooltip.style('opacity', 1);

            let blockedBy = d.blocked_by && d.blocked_by.length > 0
                ? `<div class="tooltip-deps">被阻塞: ${d.blocked_by.map(id => '#' + id).join(', ')}</div>`
                : '';

            let blocks = d.blocks && d.blocks.length > 0
                ? `<div class="tooltip-deps">阻塞: ${d.blocks.map(id => '#' + id).join(', ')}</div>`
                : '';

            tooltip.html(`
                <div class="tooltip-title">#${d.id}</div>
                <div>${d.title}</div>
                ${blockedBy}
                ${blocks}
            `)
            .style('left', (event.pageX + 10) + 'px')
            .style('top', (event.pageY - 10) + 'px');
        })
        .on('mouseout', () => {
            tooltip.style('opacity', 0);
        });

        // Update positions on each tick
        simulation.on('tick', () => {
            link.attr('d', d => {
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const dr = Math.sqrt(dx * dx + dy * dy);
                return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
            });

            node.attr('cx', d => d.x).attr('cy', d => d.y);
            label.attr('x', d => d.x).attr('y', d => d.y + 4);
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
</body>
</html>
